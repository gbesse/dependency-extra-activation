[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-extra-activation"
version = "0.1.0a1"
description = "FR: Expliquer les dépendances conditionnelles par extra | EN: Explain conditional dependencies activated by extras | ES: Explicar dependencias condicionales por extras"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
dependency-extra-activation = "dependency_extra_activation.__main__:main"

[tool.setuptools.packages.find]
include = ["dependency_extra_activation*"]
